<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Sefton | Slip Printer</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- APP STYLES --- */
        :root {
            --bg-app: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-paper: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOOLBAR */
        #toolbar {
            background: var(--bg-sidebar);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            z-index: 20;
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        #toolbar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* MAIN LAYOUT */
        #main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            flex-grow: 1;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: min-content;
            padding: 16px;
            gap: 8px;
            overflow-y: auto;
            align-content: start;
        }

        .sidebar-btn {
            background: white;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.1s ease;
            text-align: left;
            line-height: 1.3;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .star-icon {
            width: 16px;
            height: 16px;
            cursor: pointer;
            color: #cbd5e1;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .star-icon:hover {
            color: #fbbf24;
        }
        .star-icon.active {
            color: #fbbf24;
            fill: #fbbf24;
        }

        .sidebar-btn:hover {
            background: #f1f5f9;
            color: var(--accent);
            border-color: var(--accent);
        }

        .sidebar-btn.active {
            background: #e0f2fe;
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        /* EDITOR AREA */
        #editor-container {
            width: 400px;
            flex-shrink: 0;
            flex-grow: 0;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        #paper {
            width: 100%;
            max-width: 320px; 
            background: var(--bg-paper);
            min-height: 400px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border-radius: 2px;
            color: black;
            height: fit-content;
            position: relative;
        }

        /* EDITOR CONTENT STYLES */
        .editor-content {
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
        }
        
        .editor-content p {
            margin: 0;
        }
        
        .editor-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
        }

        /* PRINT BUTTON */
        #print-btn {
            background-color: var(--text-primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }

        #print-btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        /* RESTORE HIDDEN BUTTON */
        #restore-hidden-btn {
            background-color: white;
            color: #64748b;
            border: 1px dashed #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        #restore-hidden-btn:hover {
            background-color: #f8fafc;
            color: #334155;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* EXPORT BUTTON */
        #export-png-btn {
            background-color: white;
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        #export-png-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        /* CONTEXT MENU BUTTONS */
        .context-menu-btn {
            background: none;
            border: none;
            padding: 8px 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            color: #ef4444;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            transition: background-color 0.2s;
        }
        .context-menu-btn:hover {
            background-color: #fee2e2;
        }
        .restore-btn {
            background: none;
            border: 1px dashed #cbd5e1;
            padding: 8px 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
            color: #64748b;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            transition: all 0.2s;
            margin-top: 16px;
        }
        .restore-btn:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        /* CHECKBOX */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .checkbox-label:hover {
            background: #f8fafc;
        }


    </style>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="main-container">
        <div id="sidebar"></div>
        <div id="editor-container">
            <div id="paper">
                <div id="editor" class="editor-content" contenteditable="true"></div>
            </div>
        </div>
    </div>

                favorites = favorites.filter(k => k !== key);
            } else {
                favorites.push(key);
            }
            localStorage.setItem('sefton_favorites', JSON.stringify(favorites));
            renderSidebar();
        }

        function getSortedSidebarItems() {
            let favorites = JSON.parse(localStorage.getItem('sefton_favorites'));
            if (!favorites) favorites = DEFAULT_FAVORITES;
            const items = SIDEBAR_ITEMS.map(key => ({
                key,
                label: (TEMPLATES[key].label || key.replace(/([A-Z])/g, ' $1').trim()),
                isFavorite: favorites.includes(key)
            })).filter(item => !hiddenItems.includes(item.key));

            items.sort((a, b) => {
                if (a.isFavorite === b.isFavorite) {
                    return a.label.localeCompare(b.label);
                }
                return a.isFavorite ? -1 : 1;
            });
            return items;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            
            const sortedItems = getSortedSidebarItems();
            let hasHidden = hiddenItems.length > 0;
            
            sortedItems.forEach(item => {
                const key = item.key;
                if (TEMPLATES[key]) {
                    const btn = document.createElement('div');
                    btn.className = 'sidebar-btn';
                    
                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = item.label;
                    
                    const starSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    starSvg.setAttribute('viewBox', '0 0 24 24');
                    starSvg.setAttribute('class', `star-icon ${item.isFavorite ? 'active' : ''}`);
                    starSvg.innerHTML = `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>`;
                    
                    starSvg.onclick = (e) => toggleFavorite(key, e);
                    
                    btn.appendChild(labelSpan);
                    btn.appendChild(starSvg);
                    
                    btn.onclick = () => loadTemplate(key);
                    btn.oncontextmenu = (e) => {
                        e.preventDefault();
                        showContextMenu(e.pageX, e.pageY, key);
                    };
                    btn.id = `btn-${key}`;
                    sidebar.appendChild(btn);
                }
            });
            
            const restoreBtn = document.getElementById('restore-hidden-btn');
            if (hasHidden) {
                restoreBtn.style.display = 'flex';
            } else {
                restoreBtn.style.display = 'none';
            }
            
            if (window.currentActiveKey) {
                const activeBtn = document.getElementById(`btn-${window.currentActiveKey}`);
                if (activeBtn) activeBtn.classList.add('active');
            }
        }

            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(15, 23, 42, 0.5)';
            overlay.style.display = 'flex';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.zIndex = '1000';
            overlay.style.backdropFilter = 'blur(2px)';

            const modal = document.createElement('div');
            modal.style.background = '#ffffff';
            modal.style.borderRadius = '12px';
            modal.style.padding = '24px';
            modal.style.width = '400px';
            modal.style.maxWidth = '90%';
            modal.style.boxShadow = '0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)';
            modal.style.display = 'flex';
            modal.style.flexDirection = 'column';
            modal.style.gap = '16px';

            const header = document.createElement('div');
            header.style.display = 'flex';
            header.style.justifyContent = 'space-between';
            header.style.alignItems = 'center';

            const title = document.createElement('h3');
            title.textContent = 'Restore Hidden Buttons';
            title.style.margin = '0';
            title.style.fontSize = '18px';
            title.style.fontWeight = '600';
            title.style.color = '#0f172a';

            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            closeBtn.style.background = 'none';
            closeBtn.style.border = 'none';
            closeBtn.style.cursor = 'pointer';
            closeBtn.style.color = '#64748b';
            closeBtn.style.padding = '4px';
            closeBtn.style.display = 'flex';
            closeBtn.style.alignItems = 'center';
            closeBtn.style.justifyContent = 'center';
            closeBtn.style.borderRadius = '4px';
            closeBtn.onmouseover = () => closeBtn.style.background = '#f1f5f9';
            closeBtn.onmouseout = () => closeBtn.style.background = 'none';
            closeBtn.onclick = () => overlay.remove();

            header.appendChild(title);
            header.appendChild(closeBtn);
            modal.appendChild(header);

            const listContainer = document.createElement('div');
            listContainer.style.display = 'flex';
            listContainer.style.flexDirection = 'column';
            listContainer.style.gap = '8px';
            listContainer.style.maxHeight = '50vh';
            listContainer.style.overflowY = 'auto';

            if (hiddenItems.length === 0) {
                const emptyText = document.createElement('p');
                emptyText.textContent = 'No hidden buttons.';
                emptyText.style.color = '#64748b';
                emptyText.style.fontSize = '14px';
                emptyText.style.textAlign = 'center';
                emptyText.style.margin = '20px 0';
                listContainer.appendChild(emptyText);
            } else {
                hiddenItems.forEach(key => {
                    const template = TEMPLATES[key];
                    if (!template) return;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.style.display = 'flex';
                    itemDiv.style.justifyContent = 'space-between';
                    itemDiv.style.alignItems = 'center';
                    itemDiv.style.padding = '12px 16px';
                    itemDiv.style.border = '1px solid #e2e8f0';
                    itemDiv.style.borderRadius = '8px';

                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = template.label || key;
                    labelSpan.style.fontSize = '14px';
                    labelSpan.style.color = '#334155';
                    labelSpan.style.fontWeight = '500';

                    const restoreAction = document.createElement('button');
                    restoreAction.textContent = 'Restore';
                    restoreAction.style.background = '#eff6ff';
                    restoreAction.style.color = '#2563eb';
                    restoreAction.style.border = 'none';
                    restoreAction.style.padding = '6px 12px';
                    restoreAction.style.borderRadius = '6px';
                    restoreAction.style.fontSize = '12px';
                    restoreAction.style.fontWeight = '600';
                    restoreAction.style.cursor = 'pointer';
                    restoreAction.style.transition = 'background-color 0.2s';
                    restoreAction.onmouseover = () => restoreAction.style.background = '#dbeafe';
                    restoreAction.onmouseout = () => restoreAction.style.background = '#eff6ff';

                    restoreAction.onclick = () => {
                        hiddenItems = hiddenItems.filter(k => k !== key);
                        localStorage.setItem('sefton_hidden_items', JSON.stringify(hiddenItems));
                        renderSidebar();
                        itemDiv.remove();
                        if (hiddenItems.length === 0) {
                            overlay.remove();
                        }
                    };

                    itemDiv.appendChild(labelSpan);
                    itemDiv.appendChild(restoreAction);
                    listContainer.appendChild(itemDiv);
                });
            }

            modal.appendChild(listContainer);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Close when clicking outside
            overlay.addEventListener('mousedown', (e) => {
                if (e.target === overlay) {
                    overlay.remove();
                }
            });
        }

        function loadTemplate(key) {
            window.currentActiveKey = key;
            const editor = document.getElementById('editor');
            
            let content = TEMPLATES[key].content;
            if (content.includes('{{DATETIME}}')) {
                const now = new Date();
                const dateStr = now.toLocaleDateString('en-GB'); // DD/MM/YYYY
                const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                content = content.replace('{{DATETIME}}', `${dateStr} ${timeStr}`);
            }
            
            editor.innerHTML = content;
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${key}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        async function handleExportPng() {
            const paper = document.getElementById('paper');
            const btn = document.getElementById('export-png-btn');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> EXPORTING...`;
                btn.style.pointerEvents = 'none';
                
                const baseCanvas = await html2canvas(paper, {
                    scale: 4, 
                    useCORS: true,
                    backgroundColor: "#ffffff",
                    logging: false,
                });
                
                // Create A4 Landscape Canvas at 300dpi (3508 x 2480)
                let finalCanvas = document.createElement('canvas');
                finalCanvas.width = 3508;
                finalCanvas.height = 2480;
                
                const ctx = finalCanvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                
                // Available fourth-A4 area minus margins
                const margin = 80;
                const maxW = (finalCanvas.width / 4) - (margin * 2);
                const maxH = finalCanvas.height - (margin * 2);
                
                const scaleFactor = Math.min(maxW / baseCanvas.width, maxH / baseCanvas.height);
                
                const scaledW = baseCanvas.width * scaleFactor;
                const scaledH = baseCanvas.height * scaleFactor;
                
                // Draw first slip
                const x1 = (finalCanvas.width / 8) - (scaledW / 2);
                const y = (finalCanvas.height / 2) - (scaledH / 2);
                
                ctx.setLineDash([20, 20]);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 4;
                ctx.strokeRect(x1 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x1, y, scaledW, scaledH);
                
                // Draw second slip
                const x2 = (finalCanvas.width * 3 / 8) - (scaledW / 2);
                
                ctx.strokeRect(x2 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x2, y, scaledW, scaledH);
                
                // Draw third slip
                const x3 = (finalCanvas.width * 5 / 8) - (scaledW / 2);
                
                ctx.strokeRect(x3 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x3, y, scaledW, scaledH);
                
                // Draw fourth slip
                const x4 = (finalCanvas.width * 7 / 8) - (scaledW / 2);
                
                ctx.strokeRect(x4 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x4, y, scaledW, scaledH);
                
                // Draw cut lines
                ctx.beginPath();
                ctx.moveTo(finalCanvas.width / 4, 100);
                ctx.lineTo(finalCanvas.width / 4, finalCanvas.height - 100);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(finalCanvas.width / 2, 100);
                ctx.lineTo(finalCanvas.width / 2, finalCanvas.height - 100);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(finalCanvas.width * 3 / 4, 100);
                ctx.lineTo(finalCanvas.width * 3 / 4, finalCanvas.height - 100);
                ctx.stroke();
                
                const dataUrl = finalCanvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'slip-export-a4.png';
                link.href = dataUrl;
                link.click();
            } catch (err) {
                console.error("Error generating PNG:", err);
                alert("Failed to generate PNG.");
            } finally {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
            }
        }
        
        let contextMenuTargetKey = null;
        const contextMenu = document.getElementById('context-menu');

        function showContextMenu(x, y, key) {
            contextMenuTargetKey = key;
            contextMenu.style.display = 'flex';
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('#context-menu')) return;
            if (contextMenu) contextMenu.style.display = 'none';
        });

        document.getElementById('hide-item-btn').addEventListener('click', () => {
            if (contextMenuTargetKey) {
                hiddenItems.push(contextMenuTargetKey);
                localStorage.setItem('sefton_hidden_items', JSON.stringify(hiddenItems));
                
                if (window.currentActiveKey === contextMenuTargetKey) {
                    const firstAvailable = SIDEBAR_ITEMS.find(k => !hiddenItems.includes(k));
                    if (firstAvailable) {
                        loadTemplate(firstAvailable);
                    } else {
                        document.getElementById('editor').innerHTML = '';
                    }
                }
                
                renderSidebar();
            }
            contextMenu.style.display = 'none';
        });


        function handlePrint() {
            const editorContent = document.getElementById('editor').innerHTML;
            const is10x = document.getElementById('copy-check').checked;
            const printWindow = window.open('', '_blank', 'width=800,height=600');
            
            if (!printWindow) {
                alert("Pop-up blocked! Please allow pop-ups for this site to print.");
                return;
            }

            let printHTML = '';
            
            const count = is10x ? 10 : 1;
            for (let i = 0; i < count; i++) {
                printHTML += `<div class="slip-container">${editorContent}<div class="footer-mdw">-MDW-</div></div>`;
            }

            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Slip</title>
                    <style>
                        .no-print {
                            display: none !important;
                        }
                        @page { 
                            margin: 0; 
                        }
                        * { box-sizing: border-box; }
                        html, body { 
                            margin: 0 !important; 
                            padding: 0 !important; 
                            width: 100% !important;
                            background: white;
                            color: black;
                            font-family: -apple-system, system-ui, sans-serif;
                            overflow-x: hidden !important;
                        }
                        .slip-container {
                            width: 250px; /* Secure width for RHS border visibility */
                            max-width: 250px;
                            padding: 15px 5px; 
                            text-align: center !important;
                            page-break-inside: avoid;
                            border-bottom: ${is10x ? '1px dashed black' : 'none'};
                            display: flex !important;
                            flex-direction: column !important;
                            align-items: center !important;
                            font-size: 14px; 
                            line-height: 1.3;
                            margin: 0 auto !important;
                            overflow: hidden;
                        }
                        /* Ensure boxes don't wrap internally */
                        .slip-container [style*="white-space: nowrap"] {
                            white-space: nowrap !important;
                        }
                        /* Strict RHS alignment for flex rows */
                        .slip-container div[style*="display: flex"] {
                            display: flex !important;
                            width: 100% !important;
                            max-width: 100% !important;
                            justify-content: space-between !important;
                            align-items: flex-start !important;
                            padding: 0 4px !important;
                            box-sizing: border-box !important;
                        }
                        .slip-container div[style*="display: flex"] span:first-child {
                            text-align: left !important;
                            flex-shrink: 1 !important;
                            word-wrap: break-word;
                        }
                        .slip-container div[style*="display: flex"] span:last-child {
                            text-align: right !important;
                            white-space: nowrap;
                            margin-left: 8px !important;
                            text-align: right !important;
                        }
                        img { max-width: 100%; height: auto; display: block; margin: 8px auto; }
                        p { margin: 0; padding: 0; text-align: center; width: 100%; word-wrap: break-word; }
                        .footer-mdw { font-size: 4px; color: #000; margin-top: 15px; text-align: center; width: 100%; opacity: 0.2; }
                    </style>
                </head>
                <body>
                    ${printHTML}
                    <script>
                        window.onload = function() { 
                            setTimeout(() => {
                                window.print();
                                window.close();
                            }, 500);
                        }
                    <\/script>
</body>
                </html>
            `);
            printWindow.document.close();
        }


    </script>
