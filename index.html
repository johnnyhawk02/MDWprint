    <style>
        /* --- APP STYLES --- */
        :root {
            --bg-app: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-paper: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOOLBAR */
        #toolbar {
            background: var(--bg-sidebar);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            z-index: 20;
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        #toolbar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* MAIN LAYOUT */
        #main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            flex-grow: 1;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
        }

        .sidebar-group-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .sidebar-group-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .sidebar-btn {
            background: white;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 10px 12px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            min-height: 48px;
            line-height: 1.2;
        }

        .sidebar-btn svg {
            width: 18px;
            height: 18px;
            opacity: 0.7;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .sidebar-btn:hover svg {
            opacity: 1;
            transform: scale(1.05);
        }

        .sidebar-btn.active svg {
            opacity: 1;
        }

        .sidebar-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .sidebar-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            font-weight: 600;
        }

        /* EDITOR AREA */
        #editor-container {
            width: 400px;
            flex-shrink: 0;
            flex-grow: 0;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        #paper {
            width: 100%;
            max-width: 320px; 
            background: var(--bg-paper);
            min-height: 400px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border-radius: 2px;
            color: black;
            height: fit-content;
            position: relative;
        }

        /* EDITOR CONTENT STYLES */
        .editor-content {
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
        }
        
        .editor-content p {
            margin: 0;
        }
        
        .editor-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
        }

        /* PRINT BUTTON */
        #print-btn {
            background-color: var(--text-primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }

        #print-btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        /* EXPORT BUTTON */
        #export-png-btn {
            background-color: white;
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        #export-png-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        /* CHECKBOX */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .checkbox-label:hover {
            background: #f8fafc;
        }


    </style>

        async function handleExportPng() {
            const paper = document.getElementById('paper');
            const btn = document.getElementById('export-png-btn');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> EXPORTING...`;
                btn.style.pointerEvents = 'none';
                
                const baseCanvas = await html2canvas(paper, {
                    scale: 4, 
                    useCORS: true,
                    backgroundColor: "#ffffff",
                    logging: false,
                });
                
                // Create A4 Landscape Canvas at 300dpi (3508 x 2480)
                let finalCanvas = document.createElement('canvas');
                finalCanvas.width = 3508;
                finalCanvas.height = 2480;
                
                const ctx = finalCanvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                
                // Available fourth-A4 area minus margins
                const margin = 80;
                const maxW = (finalCanvas.width / 4) - (margin * 2);
                const maxH = finalCanvas.height - (margin * 2);
                
                const scaleFactor = Math.min(maxW / baseCanvas.width, maxH / baseCanvas.height);
                
                const scaledW = baseCanvas.width * scaleFactor;
                const scaledH = baseCanvas.height * scaleFactor;
                
                // Draw first slip
                const x1 = (finalCanvas.width / 8) - (scaledW / 2);
                const y = (finalCanvas.height / 2) - (scaledH / 2);
                
                ctx.setLineDash([20, 20]);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 4;
                ctx.strokeRect(x1 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x1, y, scaledW, scaledH);
                
                // Draw second slip
                const x2 = (finalCanvas.width * 3 / 8) - (scaledW / 2);
                
                ctx.strokeRect(x2 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x2, y, scaledW, scaledH);
                
                // Draw third slip
                const x3 = (finalCanvas.width * 5 / 8) - (scaledW / 2);
                
                ctx.strokeRect(x3 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x3, y, scaledW, scaledH);
                
                // Draw fourth slip
                const x4 = (finalCanvas.width * 7 / 8) - (scaledW / 2);
                
                ctx.strokeRect(x4 - 10, y - 10, scaledW + 20, scaledH + 20);
                ctx.drawImage(baseCanvas, x4, y, scaledW, scaledH);
                
                // Draw cut lines
                ctx.beginPath();
                ctx.moveTo(finalCanvas.width / 4, 100);
                ctx.lineTo(finalCanvas.width / 4, finalCanvas.height - 100);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(finalCanvas.width / 2, 100);
                ctx.lineTo(finalCanvas.width / 2, finalCanvas.height - 100);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(finalCanvas.width * 3 / 4, 100);
                ctx.lineTo(finalCanvas.width * 3 / 4, finalCanvas.height - 100);
                ctx.stroke();
                
                const dataUrl = finalCanvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'slip-export-a4.png';
                link.href = dataUrl;
                link.click();
            } catch (err) {
                console.error("Error generating PNG:", err);
                alert("Failed to generate PNG.");
            } finally {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
            }
        }
