    <style>
        /* --- APP STYLES --- */
        :root {
            --bg-app: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-paper: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOOLBAR */
        #toolbar {
            background: var(--bg-sidebar);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            z-index: 20;
        }

        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        #toolbar-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* MAIN LAYOUT */
        #main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            width: 340px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 24px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-group-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .sidebar-group-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .sidebar-btn {
            background: white;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 14px 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            min-height: 60px;
            line-height: 1.2;
        }

        .sidebar-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .sidebar-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            font-weight: 600;
        }

        /* EDITOR AREA */
        #editor-container {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        #paper {
            width: 100%;
            max-width: 320px; 
            background: var(--bg-paper);
            min-height: 600px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border-radius: 2px;
            color: black;
            height: fit-content;
            position: relative;
        }
        
        #paper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #3b82f6, #6366f1, #8b5cf6, #ec4899);
            opacity: 0.8;
        }

        /* EDITOR CONTENT STYLES */
        .editor-content {
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.5;
            text-align: center;
        }
        
        .editor-content p {
            margin: 0;
        }
        
        .editor-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px auto;
        }

        /* PRINT BUTTON */
        #print-btn {
            background-color: var(--text-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }

        #print-btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        
        /* CHECKBOX */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .checkbox-label:hover {
            background: #f8fafc;
        }

        /* GitHub Button */
        #github-btn {
            background-color: #24292e;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        #github-btn:hover {
            background-color: #1b1f23;
            transform: translateY(-1px);
        }
    </style>

                const grid = document.createElement('div');
                grid.className = 'sidebar-group-grid';

                group.items.forEach(key => {
                    if (TEMPLATES[key]) {
                        const btn = document.createElement('div');
                        btn.className = 'sidebar-btn';
                        btn.innerText = TEMPLATES[key].label || key.replace(/([A-Z])/g, ' $1').trim(); 
                        btn.onclick = () => loadTemplate(key);
                        btn.id = `btn-${key}`;
                        grid.appendChild(btn);
                    }
                });

                groupDiv.appendChild(grid);
                sidebar.appendChild(groupDiv);
            });
        }

        function loadTemplate(key) {
            const editor = document.getElementById('editor');
            editor.innerHTML = TEMPLATES[key].content;
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${key}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function handlePrint() {
            const editorContent = document.getElementById('editor').innerHTML;
            const is10x = document.getElementById('copy-check').checked;
            const printWindow = window.open('', '_blank', 'width=450,height=600');
            
            if (!printWindow) {
                alert("Pop-up blocked! Please allow pop-ups for this site to print.");
                return;
            }

            let printHTML = '';
            const count = is10x ? 10 : 1;
            for (let i = 0; i < count; i++) {
                printHTML += `<div class="slip-container">${editorContent}<div class="footer-mdw">-MDW-</div></div>`;
            }

            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Slip</title>
                    <style>
                        @page { margin: 0; }
                        * { box-sizing: border-box; }
                        html, body { 
                            margin: 0 !important; 
                            padding: 0 !important; 
                            width: 100% !important;
                            background: white;
                            color: black;
                            font-family: -apple-system, system-ui, sans-serif;
                            overflow-x: hidden !important;
                        }
                        .slip-container {
                            width: 250px; /* Secure width for RHS border visibility */
                            max-width: 250px;
                            padding: 15px 5px; 
                            text-align: center !important;
                            page-break-inside: avoid;
                            border-bottom: ${is10x ? '1px dashed black' : 'none'};
                            display: flex !important;
                            flex-direction: column !important;
                            align-items: center !important;
                            font-size: 14px; 
                            line-height: 1.3;
                            margin: 0 auto !important;
                            overflow: hidden;
                        }
                        /* Ensure boxes don't wrap internally */
                        .slip-container [style*="white-space: nowrap"] {
                            white-space: nowrap !important;
                        }
                        /* Strict RHS alignment for flex rows */
                        .slip-container div[style*="display: flex"] {
                            display: flex !important;
                            width: 100% !important;
                            max-width: 100% !important;
                            justify-content: space-between !important;
                            align-items: flex-start !important;
                            padding: 0 4px !important;
                            box-sizing: border-box !important;
                        }
                        .slip-container div[style*="display: flex"] span:first-child {
                            text-align: left !important;
                            flex-shrink: 1 !important;
                            word-wrap: break-word;
                        }
                        .slip-container div[style*="display: flex"] span:last-child {
                            text-align: right !important;
                            white-space: nowrap;
                            margin-left: 8px !important;
                            text-align: right !important;
                        }
                        img { max-width: 100%; height: auto; display: block; margin: 8px auto; }
                        p { margin: 0; padding: 0; text-align: center; width: 100%; word-wrap: break-word; }
                        .footer-mdw { font-size: 4px; color: #000; margin-top: 15px; text-align: center; width: 100%; opacity: 0.2; }
                    </style>
                </head>
                <body>
                    ${printHTML}
                    <script>
                        window.onload = function() { 
                            setTimeout(() => {
                                window.print();
                                window.close();
                            }, 500);
                        }
                    <\/script>
</body>
                </html>
            `);
            printWindow.document.close();
        }

        async function startGitHubSync() {
            const modal = document.getElementById('gh-modal');
            const step1 = document.getElementById('gh-step-1');
            const step2 = document.getElementById('gh-step-2');
            const stepSuccess = document.getElementById('gh-step-success');
            const stepError = document.getElementById('gh-step-error');
            const statusText = document.querySelector('#gh-step-1 p:last-child');
            
            modal.style.display = 'flex';
            step1.style.display = 'block';
            step2.style.display = 'none';
            stepSuccess.style.display = 'none';
            stepError.style.display = 'none';

            try {
                // 1. Request Device Code
                statusText.innerText = "Connecting to GitHub...";
                const res = await fetch('/api/github/device-code', { method: 'POST' });
                if (!res.ok) throw new Error('Failed to connect to server');
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                document.getElementById('gh-user-code').innerText = data.user_code;
                const verifyLink = document.getElementById('gh-verify-link');
                verifyLink.href = data.verification_uri;
                
                statusText.innerText = "Waiting for authorization...";

                // 2. Poll for Token (Recursive)
                const intervalMs = (data.interval || 5) * 1000;
                let isPolling = true;

                // Stop polling if modal is closed
                const closeModal = () => {
                    isPolling = false;
                    modal.style.display = 'none';
                };
                
                // Override close buttons to stop polling
                const closeBtns = modal.querySelectorAll('button');
                closeBtns.forEach(btn => {
                    const oldOnClick = btn.onclick;
                    btn.onclick = (e) => {
                        isPolling = false;
                        if (oldOnClick) oldOnClick(e);
                        else modal.style.display = 'none';
                    };
                });

                const poll = async () => {
                    if (!isPolling) return;

                    try {
                        const pollRes = await fetch('/api/github/poll-token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ device_code: data.device_code })
                        });
                        
                        if (!pollRes.ok) {
                             // If server error, retry after delay
                             if (isPolling) setTimeout(poll, intervalMs);
                             return;
                        }

                        const pollData = await pollRes.json();

                        if (pollData.access_token) {
                            isPolling = false;
                            step1.style.display = 'none';
                            step2.style.display = 'block';
                            pushCode(pollData.access_token);
                        } else if (pollData.error === 'authorization_pending') {
                            if (isPolling) setTimeout(poll, intervalMs);
                        } else if (pollData.error === 'slow_down') {
                            if (isPolling) setTimeout(poll, intervalMs + 5000);
                        } else {
                            isPolling = false;
                            showError(pollData.error_description || pollData.error);
                        }
                    } catch (err) {
                        console.error("Poll error", err);
                        // Retry on network error
                        if (isPolling) setTimeout(poll, intervalMs);
                    }
                };
                
                setTimeout(poll, intervalMs);

            } catch (err) {
                showError(err.message);
            }
        }

        async function pushCode(token) {
            try {
                const res = await fetch('/api/github/push', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                document.getElementById('gh-step-2').style.display = 'none';
                document.getElementById('gh-step-success').style.display = 'block';
                document.getElementById('gh-repo-link').href = data.repoUrl;

            } catch (err) {
                showError(err.message);
            }
        }

        function showError(msg) {
            document.getElementById('gh-step-1').style.display = 'none';
            document.getElementById('gh-step-2').style.display = 'none';
            document.getElementById('gh-step-error').style.display = 'block';
            document.getElementById('gh-error-msg').innerText = msg;
        }

        // Hide GitHub Sync button on production site
        if (window.location.hostname === 'mdwprint.netlify.app') {
            const ghBtn = document.getElementById('github-btn');
            if (ghBtn) ghBtn.style.display = 'none';
        }
    </script>
</body>
